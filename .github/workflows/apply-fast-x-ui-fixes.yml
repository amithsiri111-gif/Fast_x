name: Apply Fast_X UI UX fixes

on:
  push:
    branches:
      - fix/fast-x-ui-ux

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested UI UX fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/main.jsx')
          css = Path('src/styles.css')
          text = main.read_text()

          replacements = [
              (
                  "      setWaModalTx(data.transaction);",
                  "      setDrawer(false);\n      setWaModalTx(data.transaction);"
              ),
              (
                  "              <div style={{ margin: '8px 0', textAlign: 'center', background: 'rgba(0,0,0,0.2)', padding: '8px', borderRadius: '8px' }}>",
                  "              <div style={{ overflow: 'hidden', maxWidth: '100%', margin: '8px 0', textAlign: 'center', background: 'rgba(0,0,0,0.2)', padding: '8px', borderRadius: '8px' }}>"
              ),
              (
                  "                  style={{ maxHeight: '130px', maxWidth: '100%', borderRadius: '6px', objectFit: 'contain' }}",
                  "                  style={{ maxHeight: '130px', maxWidth: '100%', borderRadius: '6px', objectFit: 'cover' }}"
              ),
              (
                  '      <button className="close" onClick={() => setDrawer(false)}>×</button>',
                  '      <button className="close" onClick={() => setDrawer(false)} aria-label="Close navigation menu">×</button>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected main.jsx pattern: {old[:120]}')
              text = text.replace(old, new, 1)

          # Add the drawer language class to EN, SI and TA buttons.
          marker = "          <button \n            type=\"button\" \n            style={{ flex: 1, padding: '8px', borderRadius: '8px', fontSize: '12px', fontWeight: '700', border: '1px solid var(--line)', background: lang === 'en'"
          if marker not in text:
              raise SystemExit('Missing EN drawer language button')
          text = text.replace(marker, marker.replace('style=', 'className=\"drawer-lang-btn\" \n            style='), 1)

          marker = "          <button \n            type=\"button\" \n            style={{ flex: 1, padding: '8px', borderRadius: '8px', fontSize: '12px', fontWeight: '700', border: '1px solid var(--line)', background: lang === 'si'"
          if marker not in text:
              raise SystemExit('Missing SI drawer language button')
          text = text.replace(marker, marker.replace('style=', 'className=\"drawer-lang-btn\" \n            style='), 1)

          marker = "          <button \n            type=\"button\" \n            style={{ flex: 1, padding: '8px', borderRadius: '8px', fontSize: '12px', fontWeight: '700', border: '1px solid var(--line)', background: lang === 'ta'"
          if marker not in text:
              raise SystemExit('Missing TA drawer language button')
          text = text.replace(marker, marker.replace('style=', 'className=\"drawer-lang-btn\" \n            style='), 1)

          old = "            <textarea value={notes[tx.id] || ''} onChange={e => setNotes(prev => ({ ...prev, [tx.id]: e.target.value }))} placeholder=\"Optional admin note\" maxLength={1000} />"
          new = "            <label htmlFor={`admin-note-${tx.id}`}>Optional admin note:</label>\n" + old.replace('<textarea ', '<textarea id={`admin-note-${tx.id}`} ', 1)
          if old not in text:
              raise SystemExit('Missing admin note textarea')
          text = text.replace(old, new, 1)

          main.write_text(text)

          styles = css.read_text()
          additions = r'''

/* Fast_X UI/UX fixes */
.hamburger {
  display: flex;
  flex-shrink: 0;
}

@media (max-width: 360px) {
  .brand {
    font-size: 16px;
  }
}

.admin-stats > div {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.admin-stats span {
  margin-bottom: 4px;
}

.green:hover {
  opacity: 0.9;
}

.blue:hover {
  opacity: 0.9;
}

[data-theme="light"] .green:hover {
  opacity: 0.9 !important;
}

[data-theme="light"] .blue:hover {
  opacity: 0.9 !important;
}

.drawer-lang-btn:hover {
  background: rgba(255, 255, 255, 0.08);
}

@supports (padding: max(0px)) {
  .floating-wa-btn, .floating-wa-fab {
    bottom: calc(env(safe-area-inset-bottom) + 82px);
  }
}

[data-theme="light"] .status.PENDING {
  background: rgba(255, 165, 0, 0.15);
  color: #b45309;
}
'''
          if '/* Fast_X UI/UX fixes */' not in styles:
              css.write_text(styles.rstrip() + additions)

      - name: Validate and commit fixes
        shell: bash
        run: |
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-fast-x-ui-fixes.yml
          git add src/main.jsx src/styles.css .github/workflows/apply-fast-x-ui-fixes.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: polish Fast_X UI and accessibility"
          git push origin HEAD:fix/fast-x-ui-ux
